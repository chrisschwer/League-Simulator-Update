# Dependabot configuration — opens weekly grouped dependency-update PRs.
# - Cargo: scans league-simulator-rust/Cargo.toml + Cargo.lock
# - GitHub Actions: scans .github/workflows/*.yml action versions
# - Docker: scans Dockerfile, Dockerfile.build, league-simulator-rust/Dockerfile FROM lines
# Schedule: every Monday so updates land at the start of the week and operators
# can review them with the rest of the week's work.
#
# Nicht abgedeckt (Dependabot kennt kein R/CRAN und keine Build-ARGs):
# - ARG P3M_SNAPSHOT im Dockerfile (R-Paketstand aus dem Posit Package Manager)
# - Neubauten desselben Basis-Tags (rocker/r-ver:4.6.1 mit Sicherheitsupdates)
# Dafuer gibt es .github/workflows/p3m-snapshot.yml: am ersten Montag im Monat
# ein PR deps/p3m-snapshot-<datum>, dessen CI das Image ohne Cache baut.
# Manuell: gh workflow run p3m-snapshot.yml. Details: docs/deployment/README.md,
# Abschnitt "Image-Pflege".
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/league-simulator-rust"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "rust"
    groups:
      rust-deps:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      gh-actions:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"
