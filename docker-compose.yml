# Reference compose file for the production scheduler.
#
# The deployment host keeps a copy of this file with `image:` pinned to a
# specific CI-built tag (chrisschwer/league-simulator:<sha>) and a `.env`
# next to it holding RAPIDAPI_KEY and SEASON. The generated static site lands
# in the external named volume `fussball-site`, which the host's web server
# (Caddy) mounts read-only. See docs/deployment/static-site.md.
services:
  scheduler:
    image: chrisschwer/league-simulator:latest
    container_name: fussball-scheduler
    environment:
      - RAPIDAPI_KEY=${RAPIDAPI_KEY}
      - SEASON=${SEASON}
      - DURATION=${DURATION:-480}
      - RUST_API_URL=http://localhost:8080
      - TZ=Europe/Berlin
      - STATIC_SITE_DIR=/app/ShinyApp/public
    volumes:
      - fussball-site:/app/ShinyApp/public
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # The Rust API stays container-internal; the healthcheck is the only consumer.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    # Resource limits for docker-compose v2/v3 (not swarm mode)
    mem_limit: 2g
    cpus: 4.0

volumes:
  fussball-site:
    external: true
